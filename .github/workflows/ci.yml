name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating the GitHub release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

      # Only for a version tag (git tag v0.2.1; git push --tags): pack the built package, stage it on npm and attach it to a GitHub release.
      # The staged version goes live after approval with 2FA: npm stage approve <stage-id>, or on npmjs.com.
      - name: Pack, publish and release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: dist/geodienst/dashkit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $VERSION in package.json."
            exit 1
          fi
          npm pack
          npm stage publish
          gh release create "$GITHUB_REF_NAME" "geodienst-dashkit-$VERSION.tgz" --title "$GITHUB_REF_NAME" --generate-notes
