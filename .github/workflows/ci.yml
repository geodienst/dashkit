name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating the GitHub release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

      # Only for a version tag (git tag v0.1.0; git push --tags): pack the built package and attach it to a GitHub release.
      - name: Pack and release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: dist/geodienst/geodashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $VERSION in package.json."
            exit 1
          fi
          npm pack
          gh release create "$GITHUB_REF_NAME" "geodienst-geodashboard-$VERSION.tgz" --title "$GITHUB_REF_NAME" --generate-notes
