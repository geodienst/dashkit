<div class="scroll">
  <table mat-table [dataSource]="items()">
    @for (column of columns(); track $index) {
      <ng-container [matColumnDef]="columnIds()[$index]">
        <th mat-header-cell *matHeaderCellDef>{{ column.header }}</th>
        <td mat-cell *matCellDef="let item">{{ column.value(item) }}</td>
      </ng-container>
    }
    <tr mat-header-row *matHeaderRowDef="columnIds(); sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: columnIds()"></tr>
  </table>
</div>
@if (fileNameForDownload(); as fileName) {
  <button
    matFab
    (click)="download(fileName)"
    matTooltip="Download CSV"
    i18n-matTooltip="@@dataTable.download"
    aria-label="Download CSV"
    i18n-aria-label="@@dataTable.download"
  >
    <mat-icon>download</mat-icon>
  </button>
}
