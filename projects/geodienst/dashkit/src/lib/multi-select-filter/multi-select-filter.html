<mat-form-field subscriptSizing="dynamic">
  <mat-label>{{ label() }}</mat-label>
  <!-- panelWidth="": the open list fits its options instead of the (possibly squeezed) field. -->
  <mat-select multiple panelWidth="" [(value)]="selected">
    @if (selectAll()) {
      <mat-checkbox
        [checked]="selected().length === options().length"
        (change)="selected.set($event.checked ? options() : [])"
        i18n="@@multiSelectFilter.selectAll"
      >
        Select all
      </mat-checkbox>
    }
    @for (option of options(); track option) {
      <mat-option [value]="option">{{ optionLabels()[option] ?? option }}</mat-option>
    }
  </mat-select>
</mat-form-field>
