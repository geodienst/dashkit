<mat-form-field subscriptSizing="dynamic">
  <mat-label i18n="@@itemList.search">Search</mat-label>
  <input matInput #searchField (input)="search.set(searchField.value)" />
</mat-form-field>
<mat-action-list>
  @for (row of rows(); track $index) {
    <button mat-list-item [matTooltip]="row.text" (click)="itemClick.emit(row.item)">
      @if (icon(); as icon) {
        <span matListItemIcon><ng-container *ngTemplateOutlet="icon; context: { $implicit: row.item }" /></span>
      }
      {{ row.text }}
    </button>
  }
</mat-action-list>
